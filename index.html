<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="わが家">
<title>わが家のお金</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=M+PLUS+1p:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 鍵 -->
<section id="lock" class="lock" hidden>
  <div class="lock-in">
    <svg class="lock-mark" viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="40" height="40" rx="12"/><path d="M15 31c4-9 8-13 18-15"/><circle cx="33" cy="16" r="3.2"/></svg>
    <h1>わが家のお金</h1>
    <p>合言葉を入れてください。この端末に鍵が保存され、次からは入力なしで開けます。</p>
    <form id="lockForm" autocomplete="off">
      <input id="pass" type="text" inputmode="text" autocapitalize="none" spellcheck="false" placeholder="xxxxx-xxxxx-xxxxx-xxxxx-xxxxx" aria-label="合言葉">
      <button type="submit" id="unlockBtn">開く</button>
    </form>
    <p class="lock-msg" id="lockMsg" role="status"></p>
  </div>
</section>

<main id="app" hidden>
  <section class="view" id="v-now" data-tab="now"></section>
  <section class="view" id="v-flow" data-tab="flow" hidden></section>
  <section class="view" id="v-future" data-tab="future" hidden></section>
</main>

<nav class="tab" id="tabbar" hidden>
  <button data-go="now" class="on"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 4l8.5 6.5V20h-17z"/><path d="M9.5 20v-5.5h5V20"/></svg>いま</button>
  <button data-go="flow"><svg viewBox="0 0 24 24"><path d="M5 20V11M10 20V6M15 20v-7M20 20V9"/></svg>流れ</button>
  <button data-go="future"><svg viewBox="0 0 24 24"><path d="M3 19l6-6 4 3 8-9"/><path d="M15 7h6v6"/></svg>未来</button>
</nav>

<script src="crypto.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
